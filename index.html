<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holiday Finder</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Main div -->
    <div> 
        <!-- Top heading -->
      <div class="text-2xl md:text-4xl text-center font-bold m-8 underline">
        Holiday Calendar
      </div>
      <!-- Select country drop down -->
      <div class="flex flex-col md:flex-row justify-center items-center">
        <div class="m-2 p-2 min-w-0 w-full md:w-auto">
          <select
            class="p-2 font-medium text-base md:text-xl border-2 border-red-500 rounded-lg text-blue-600 w-full"
            name="country"
            id="country"
          >
            <!-- <option value="">Select Country</option> -->
          </select>
        </div>
        <!-- Select year drop down -->
        <div class="m-2 p-2 min-w-0 w-full md:w-auto">
          <select
            class="p-2 font-medium text-base md:text-xl border-2 border-red-500 rounded-lg text-blue-600 w-full"
            name="year"
            id="year"
          >
            <!-- <option value="">Select Year</option> -->
          </select>
        </div>
        <!-- Search button  -->
        <div class="m-2 p-2">
          <button
            type="button"
            id="searchbtn"
            class="p-2 font-medium text-xl border-2 border-red-500 rounded-lg bg-green-300"
          >
            Search Holiday
          </button>
        </div>
        <!-- Clear button -->
        <div class="m-2 p-2">
          <button
            type="button"
            id="clearbtn"
            class="p-2 font-medium text-xl border-2 border-red-500 rounded-lg bg-red-300"
          >
            Clear History
          </button>
        </div>
      </div>
      <!-- Recent History UI -->
      <div class="m-2 p-2 md:ml-10">
        <div id="history-list">
          <p class="font-bold text-lg text-gray-500 underline">Recent History</p>
        </div>
        <div id="historypills" class="flex flex-row flex-wrap">

        </div>
      </div>
      
      <div class="m-2 md:m-10 p-2 mt-4 md:mt-10">
        <!-- Loading Indicator -->
        <div id="loading" class="hidden flex items-center justify-center w-full">
        <div
          class="w-20 h-20 border-4 border-gray-300 border-t-blue-500 rounded-full animate-spin"
        ></div>
      </div>
      <!-- No holidays message -->
        <div
          id="noholiday"
          class="text-2xl md:text-4xl text-center font-bold text-red-600 underline"
        ></div>
        <!-- Table for showing holidays with 6 fields -->
        <div class="overflow-x-auto">
        <table id="table" class="table-auto border-2 border-black w-full">
          <thead id="tablehead"></thead>
          <tbody id="tablebody"></tbody>
        </table>
        </div>
      </div>
    </div>
    <!-- JS script file -->
    <script src="script.js"></script>
  </body>
</html>
